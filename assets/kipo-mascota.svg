<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Kipo, expresión "feliz", paleta menta. Las capas, de atrás hacia adelante:
       sombra, argolla (llave), pies, cuerpo, sombreado, brillo, mejillas, cara, cerradura. -->
  <defs>
    <radialGradient id="kBody" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#C8FAEA"/>
      <stop offset="0.45" stop-color="#3DD9B0"/>
      <stop offset="1" stop-color="#0E8A6C"/>
    </radialGradient>
    <radialGradient id="kShade" cx="70%" cy="85%" r="60%">
      <stop offset="0" stop-color="#0A5E4D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0A5E4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kFoot" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5FE3BF"/>
      <stop offset="1" stop-color="#0B7A5F"/>
    </radialGradient>
    <linearGradient id="kRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE2A3"/>
      <stop offset="0.5" stop-color="#FFC266"/>
      <stop offset="1" stop-color="#C98316"/>
    </linearGradient>
    <linearGradient id="kHole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F3A"/>
      <stop offset="1" stop-color="#454B5C"/>
    </linearGradient>
    <filter id="kBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="kSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="100" cy="206" rx="60" ry="9" fill="#2B2F3A" opacity="0.18" filter="url(#kSoft)"/>
  <g id="argolla">
    <rect x="95" y="40" width="10" height="18" rx="4" fill="url(#kRing)"/>
    <circle cx="100" cy="30" r="14" fill="none" stroke="url(#kRing)" stroke-width="7"/>
    <path d="M90 22 A12 12 0 0 1 104 17" fill="none" stroke="#FFF3D6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <ellipse cx="70" cy="192" rx="20" ry="11" fill="url(#kFoot)"/>
  <ellipse cx="130" cy="192" rx="20" ry="11" fill="url(#kFoot)"/>
  <path d="M100 52 C150 52 172 92 172 135 C172 178 140 198 100 198 C60 198 28 178 28 135 C28 92 50 52 100 52 Z" fill="url(#kBody)"/>
  <path d="M100 52 C150 52 172 92 172 135 C172 178 140 198 100 198 C60 198 28 178 28 135 C28 92 50 52 100 52 Z" fill="url(#kShade)"/>
  <ellipse cx="68" cy="82" rx="22" ry="11" transform="rotate(-32 68 82)" fill="#FFFFFF" opacity="0.6" filter="url(#kBlur)"/>
  <circle cx="58" cy="100" r="3.5" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="64" cy="130" rx="10" ry="5.5" fill="#FF8F7A" opacity="0.4"/>
  <ellipse cx="136" cy="130" rx="10" ry="5.5" fill="#FF8F7A" opacity="0.4"/>
  <g id="cara-feliz">
    <ellipse cx="80" cy="112" rx="8" ry="11" fill="#2B2F3A"/>
    <ellipse cx="120" cy="112" rx="8" ry="11" fill="#2B2F3A"/>
    <circle cx="83" cy="107" r="3" fill="#FFFFFF"/>
    <circle cx="123" cy="107" r="3" fill="#FFFFFF"/>
    <path d="M91 128 Q100 137 109 128" fill="none" stroke="#2B2F3A" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="153" r="11" fill="url(#kHole)"/>
  <path d="M94 158 L106 158 L110 180 L90 180 Z" fill="url(#kHole)"/>
  <path d="M93 147 A8 8 0 0 1 101 144" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
</svg>
